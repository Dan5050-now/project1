# TEA rule catalog — machine-readable source for the review engine.
# Generated by tools/build_rule_catalog.py. Maintained alongside
# docs/spec/TEA-SPEC-001_programming-specification.xlsx (Rules sheet).
# CI enforces consistency via tools/check_catalog_drift.py.
# Rule logic confirmed over two review rounds (2026-08-19, 2026-08-21).
# NOT frozen: the pack freezes when Rule_Messages is accepted at the Step 2 gate.
version: 1.2.0
guidelines: [RECIST_1_1, iRECIST]
rule_count: 85
rules:
  - id: TE-BL-001
    family: BL
    title: "Number of target lesions exceeds the maximum"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.97
    required_fields: "lesions.category"
    intent: "Target lesion count must not exceed the guideline/protocol maximum."
    logic: |
      n = count(lesions where category == TARGET and identified at baseline)
      if n > config.max_target_lesions_total: raise finding
    messages:
      review_point: "Maximum number of target lesions permitted at baseline."
      issue: "Subject {subject_id}: {n} target lesions are recorded at baseline; the maximum permitted is {max_total}."
      reason: "RECIST {guideline_version} permits a maximum of {max_total} target lesions in total. Additional lesions must be recorded as non-target. Including extra lesions in the sum changes the denominator for percent change and can alter the response category at every subsequent timepoint."
      query: "{n} target lesions are recorded at baseline for this subject, exceeding the maximum of {max_total} specified in the protocol. Please review the target lesion selection and re-classify the excess lesions as non-target, updating all affected assessments."
      tips: "Re-selection changes the baseline sum and therefore every subsequent percent change; expect all downstream responses to require re-derivation. Prioritise this issue before reviewing any response mismatch for this subject."
  - id: TE-BL-002
    family: BL
    title: "Target lesions per organ exceeds the maximum"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.88
    intent: "No more than the permitted number of target lesions may be selected from any one organ."
    logic: |
      for organ, group in targets grouped by organ:
          if count(group) > config.max_target_lesions_per_organ: raise finding
    messages:
      review_point: "Maximum number of target lesions per organ."
      issue: "Subject {subject_id}: {n} target lesions are recorded in {organ}; the maximum permitted per organ is {max_per_organ}."
      reason: "RECIST {guideline_version} limits target lesions to {max_per_organ} per organ so that the sum represents the overall disease burden rather than one organ. Over-representation of one organ biases the response assessment."
      query: "{n} target lesions are recorded in {organ}, exceeding the per-organ maximum of {max_per_organ}. Please re-classify the excess lesions as non-target and update the affected assessments."
      tips: "Lymph nodes in different nodal stations are commonly all coded to a single \"lymph node\" organ; confirm whether the sponsor's convention treats nodal stations as separate organs before raising."
  - id: TE-BL-003
    family: BL
    title: "Non-nodal target lesion below the measurability threshold at baseline"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.94
    intent: "Target lesions must be measurable at baseline."
    logic: |
      for t in non-nodal targets:
          threshold = config.min_measurable_non_nodal_mm
          if method == CXR:            threshold = config.min_measurable_cxr_mm
          if method == CLINICAL_EXAM:  threshold = config.min_measurable_clinical_exam_mm
          if baseline value < threshold: raise finding
    messages:
      review_point: "Measurability of selected target lesions at baseline."
      issue: "Subject {subject_id}: target lesion {lesion_id} ({organ}) measures {value} mm at baseline by {method}, below the {threshold} mm minimum for a measurable lesion."
      reason: "RECIST {guideline_version} requires a non-nodal lesion to be at least {threshold} mm by {method} to be measurable and therefore eligible as a target lesion. Sub-threshold lesions are subject to unreliable measurement, and including one makes the whole sum unreliable."
      query: "Target lesion {lesion_id} measures {value} mm at baseline, below the {threshold} mm threshold for measurability by {method}. Please confirm the measurement, or re-classify this lesion as non-target and update the affected assessments."
      tips: "Check the imaging slice thickness where available: a lesion must be at least twice the slice thickness to be measurable, so a 10 mm lesion on 8 mm slices is not measurable even though it meets the nominal threshold."
  - id: TE-BL-004
    family: BL
    title: "Nodal target lesion with baseline short axis below 15 mm"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.93
    intent: "Only nodes with short axis at least 15 mm are eligible as target lesions."
    logic: |
      for t in nodal targets:
          if baseline short axis < config.min_measurable_nodal_short_axis_mm: raise finding
    messages:
      review_point: "Eligibility of lymph nodes as target lesions (short axis ≥ 15 mm)."
      issue: "Subject {subject_id}: nodal target lesion {lesion_id} ({organ}) has a baseline short axis of {value} mm, below the 15 mm requirement."
      reason: "RECIST 1.1 requires a short axis of at least 15 mm for a node to be measurable and selectable as a target lesion. Nodes with a short axis of 10 to under 15 mm are pathological but non-measurable and should be recorded as non-target; nodes under 10 mm are non-pathological and should not be recorded at all."
      query: "Nodal target lesion {lesion_id} has a baseline short axis of {value} mm recorded at {visit}. Please confirm against the source imaging report whether this measurement is correct, and whether this node was intended to be recorded as a target lesion."
      tips: "This is one of the most frequent baseline errors. Verify that the recorded value is a short axis and not a longest diameter before concluding the selection was wrong."
  - id: TE-BL-005
    family: BL
    title: "Non-pathological node recorded as a lesion"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.82
    intent: "Nodes with short axis below 10 mm are not pathological and should not be recorded."
    logic: |
      for l in nodal lesions (target or non-target):
          if baseline short axis < config.pathological_node_threshold_mm: raise finding
    messages:
      review_point: "Recording of lymph nodes that do not meet the pathological threshold."
      issue: "Subject {subject_id}: node {lesion_id} ({organ}) has a baseline short axis of {value} mm and is recorded as a {category} lesion."
      reason: "Under RECIST 1.1 a node with a short axis below 10 mm is considered non-pathological and is not recorded or followed. Recording it adds normal tissue to the disease assessment and can prevent a complete response from being assigned."
      query: "Node {lesion_id} has a baseline short axis of {value} mm recorded at {visit}. Please confirm whether this node was intended to be recorded as disease for this subject, and correct the record if it was not."
      tips: "Where a node is clinically relevant despite being below threshold (for example biopsy-proven involvement), the site should document the rationale; consider accepting with a comment rather than a data change."
  - id: TE-BL-006
    family: BL
    title: "Lesion size below twice the imaging slice thickness"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: HYBRID
    status: CONDITIONAL
    confidence_base_rate: 0.70
    required_fields: "imaging_metadata.slice_thickness_mm"
    intent: "Measurability depends on slice thickness, not only on the nominal threshold."
    logic: |
      if lesion is target and baseline value < 2 * slice_thickness_mm: raise finding
    messages:
      review_point: "Lesion measurability relative to the imaging slice thickness."
      issue: "Subject {subject_id}: target lesion {lesion_id} measures {value} mm at baseline on {method} with {slice_thickness} mm slices."
      reason: "RECIST 1.1 requires a lesion to be at least twice the slice thickness to be measurable; on {slice_thickness} mm slices the minimum measurable lesion is {min_size} mm. Below that, apparent size changes may be partial-volume artefacts rather than real change."
      query: "Target lesion {lesion_id} measures {value} mm at baseline on images with {slice_thickness} mm slice thickness. Please confirm the lesion is measurable per the imaging manual, or re-classify it as non-target."
      tips: "Slice thickness often varies between the baseline and follow-up scans; if so, the comparison itself is compromised and merits a note to the imaging vendor."
  - id: TE-BL-007
    family: BL
    title: "Non-measurable disease type selected as a target lesion"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: LLM_ADJUDICATED
    status: ACTIVE
    confidence_base_rate: 0.65
    required_fields: "lesions.organ, lesions.location_detail or description_text"
    intent: "Presentations that are non-measurable by definition must not be target lesions."
    logic: |
      deterministic pre-filter: organ or location text matches a non-measurable pattern
         (ascites, pleural effusion, pericardial effusion, leptomeningeal disease,
          lymphangitic lung/skin involvement, inflammatory breast disease,
          simple cyst, blastic bone lesion without soft tissue component,
          abdominal mass identified only by physical examination)
      then LLM adjudication over the free text confirms or rejects, returning
         {is_non_measurable: bool, category: string, confidence: 0..1, rationale: string}
      raise finding when confirmed; confidence < 0.6 → emit as INFO
    messages:
      review_point: "Selection of lesion types that RECIST classifies as non-measurable."
      issue: "Subject {subject_id}: target lesion {lesion_id} is described as \"{location_detail}\" in {organ}, which appears to be {non_measurable_category}."
      reason: "RECIST classifies {non_measurable_category} as non-measurable disease: it cannot be reproducibly measured in one dimension. Such disease must be recorded as non-target and assessed qualitatively. A non-measurable lesion inside the target sum makes the sum, and every percent change derived from it, unreliable."
      query: "Target lesion {lesion_id} is described as '{location_detail}'. Please confirm the lesion type, and whether this finding can be measured reproducibly in one dimension on the source imaging. If the description is incomplete, please add the detail from the imaging report."
      tips: "Blastic bone lesions are non-measurable, but a lytic or mixed lytic-blastic lesion with an identifiable soft tissue component can be measurable on CT/MRI. Cystic metastases can be measurable, but where non-cystic lesions are available they are preferred as targets."
  - id: TE-BL-008
    family: BL
    title: "Previously irradiated lesion selected as target without documented progression"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.72
    required_fields: "lesions.previously_irradiated OR cross_domain.radiotherapy"
    intent: "Lesions in a previously irradiated field are non-measurable unless progression after radiotherapy is documented."
    logic: |
      if lesion.category == TARGET and (lesion.previously_irradiated or radiotherapy field overlaps lesion site prior to baseline)
         and not documented progression after radiotherapy: raise finding
    messages:
      review_point: "Eligibility of lesions within a prior radiotherapy field as target lesions."
      issue: "Subject {subject_id}: target lesion {lesion_id} ({organ}) lies in a previously irradiated field (radiotherapy {rt_date}), with no documented progression at that site after treatment."
      reason: "RECIST treats lesions in a previously irradiated area, or subjected to other locoregional therapy, as non-measurable unless progression of that lesion has been demonstrated since the treatment. Post-radiation change can mimic both response and progression."
      query: "Target lesion {lesion_id} is recorded within a prior radiotherapy field. Please confirm whether progression of this specific lesion has been documented since that radiotherapy, and provide the date and source document if so."
      tips: "Also relevant for lesions treated with ablation, embolisation or surgery during the study — see TE-XD-004 for on-study local therapy."
  - id: TE-BL-009
    family: BL
    title: "No measurable disease at baseline but target lesions recorded"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.92
    intent: "Consistency between the measurable-disease determination and target lesion recording."
    logic: |
      if reported "measurable disease at baseline" == NO and count(targets) > 0: raise finding
      also inverse: if == YES and count(targets) == 0 and measurable lesions exist: raise finding
    messages:
      review_point: "Consistency between the baseline measurable disease flag and the recorded target lesions."
      issue: "Subject {subject_id}: measurable disease at baseline is recorded as {flag}, but {n} target lesions are recorded."
      reason: "The measurable-disease determination drives the response algorithm: subjects without measurable disease can only be assigned CR, Non-CR/Non-PD, PD or NE, never PR or SD. An inconsistency here produces a systematically wrong response for every timepoint, and may also affect eligibility."
      query: "Measurable disease at baseline is recorded as {flag} while {n} target lesions are entered. Please confirm the baseline disease status and correct the inconsistent record."
      tips: "Check eligibility criteria: if the protocol requires measurable disease, this may also be an eligibility deviation requiring separate escalation."
  - id: TE-BL-010
    family: BL
    title: "Baseline assessment outside the protocol window relative to first dose"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.90
    required_fields: "subjects.first_dose_date"
    intent: "Baseline imaging must be recent enough to represent pre-treatment burden."
    logic: |
      gap = first_dose_date - baseline_assessment_date
      if gap > config.baseline_window_days_before_first_dose or gap < 0: raise finding
    messages:
      review_point: "Timing of the baseline tumor assessment relative to first dose."
      issue: "Subject {subject_id}: baseline assessment dated {baseline_date}, first dose {first_dose_date}, a gap of {gap} days against a permitted window of {window} days."
      reason: "A baseline older than the protocol window may no longer represent the disease burden at the start of treatment, which biases every subsequent percent change. A baseline dated after first dose is not a baseline at all and would understate treatment effect."
      query: "The baseline tumor assessment ({baseline_date}) falls {gap} days before first dose ({first_dose_date}), outside the protocol window of {window} days. Please confirm the assessment date and whether a protocol deviation has been recorded."
      tips: "Distinguish the scan date from the assessment or read date; the protocol window normally applies to the scan."
  - id: TE-BL-011
    family: BL
    title: "Reported baseline sum of diameters does not match the recorded lesions"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.96
    required_fields: "reported_responses.sum_of_diameters_reported collected as a site-entered field"
    intent: "Arithmetic verification of the baseline sum."
    logic: |
      # baseline assessment
      if the CRF specification shows the sum is system-derived rather than site-entered:
          deactivate the rule for this study and report NOT_EVALUATED
      else:
          derived = sumOfDiameters(assessment, targets, config)
          if reported_sum is present and |reported_sum - derived.sum| > config.sum_tolerance_mm:
              raise finding
    messages:
      review_point: "Recomputation of the baseline sum of diameters from the individual target lesion measurements."
      issue: "Subject {subject_id}: baseline sum of diameters is reported as {reported} mm; the sum of the {n} recorded target lesions is {derived} mm (difference {difference} mm)."
      reason: "The baseline sum is the reference for every partial response determination. An error of {difference} mm shifts the 30% response threshold and can change the response category at multiple timepoints. Recorded lesions: {lesion_breakdown}."
      query: "The baseline sum of diameters ({reported} mm) does not equal the sum of the recorded target lesion measurements ({derived} mm). Please verify the individual measurements and the sum."
      tips: "Check first whether a nodal target was included using its longest diameter, and whether all target lesions have a baseline measurement."
  - id: TE-BL-012
    family: BL
    title: "Target lesion selection not favouring the largest measurable lesions"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.35
    intent: "Target lesions should be the largest reproducibly measurable lesions."
    logic: |
      if any non-target measurable lesion at baseline is larger than the smallest target lesion
         by more than config.selection_margin_mm (default 5): raise finding
    messages:
      review_point: "Rationality of target lesion selection relative to lesion size."
      issue: "Subject {subject_id}: non-target lesion {nt_lesion_id} ({nt_value} mm) is larger than target lesion {t_lesion_id} ({t_value} mm)."
      reason: "RECIST directs that target lesions be selected on the basis of size, choosing the largest lesions that are reproducibly measurable, while remaining representative of all involved organs. Selecting smaller lesions as targets while larger measurable lesions are left as non-target reduces the sensitivity of the response assessment."
      query: "Non-target lesion {nt_lesion_id} ({nt_value} mm) is larger than target lesion {t_lesion_id} ({t_value} mm). Please confirm the target lesion selection rationale, for example poor reproducibility of the larger lesion."
      tips: "Reproducibility legitimately overrides size — a large but ill-defined or confluent mass is a poor target. Expect a proportion of these to be correctly explained rather than corrected."
  - id: TE-BL-013
    family: BL
    title: "Target lesion without a baseline measurement"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.93
    intent: "Every target lesion needs a baseline value to enter the sum."
    logic: |
      for t in targets: if no baseline measurement with state PRESENT: raise finding
    messages:
      review_point: "Completeness of baseline measurements for all selected target lesions."
      issue: "Subject {subject_id}: target lesion {lesion_id} has no baseline measurement (state recorded as {state})."
      reason: "Without a baseline value the lesion cannot contribute to the baseline sum, so the reference for percent change is understated and partial response may be reported prematurely."
      query: "Target lesion {lesion_id} has no baseline measurement. Please enter the baseline measurement, or re-classify the lesion if it was not measurable at baseline."
      tips: "A target lesion that was not evaluable at baseline should not have been selected as a target; check whether re-selection is required."
  - id: TE-BL-014
    family: BL
    title: "Assessment method inconsistent between baseline and follow-up for the same lesion"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.62
    intent: "The same lesion should be followed by the same modality throughout."
    logic: |
      for lesion, visits in measurements grouped by lesion:
          if distinct method_at_visit values > 1:
              candidate = lesion
      
      if the same method change affects >= config.method_change_study_wide_pct (default 50)
         of lesions at the same visit:
             raise ONE study-level finding, audience STUDY_TEAM
      else:
             raise a per-lesion finding
      
      guards:
        - no finding where the method change is recorded with a reason
    messages:
      review_point: "Consistency of imaging modality for each lesion across visits."
      issue: "Subject {subject_id}: lesion {lesion_id} is measured by {method_a} at {visit_a} and by {method_b} at {visit_b}."
      reason: "RECIST requires the same method of assessment and the same technique at baseline and during follow-up. Different modalities measure different things — a change of modality can produce an apparent size change of the order of the response thresholds without any true biological change."
      query: "Lesion {lesion_id} was assessed by {method_a} at baseline and {method_b} at {visit_b}. Please confirm the modality used and whether the change was clinically necessary."
      tips: "Where a modality change was unavoidable, the affected timepoint may need to be treated as not evaluable for that lesion rather than measured."
  - id: TE-BL-015
    family: BL
    title: "Baseline scans span more days than permitted"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.60
    required_fields: "assessments.scan_dates"
    intent: "All baseline imaging should represent a single point in time."
    logic: |
      span = max(scan_dates) - min(scan_dates)
      if span > config.scan_span_max_days: raise finding
    messages:
      review_point: "Temporal coherence of the scans composing a single tumor assessment."
      issue: "Subject {subject_id}, {visit}: scans span {span} days ({earliest} to {latest}), exceeding the permitted {max_span} days."
      reason: "An assessment is intended to be a snapshot. When component scans are widely separated, lesions measured on the later scans reflect a different point in the disease course, which distorts the sum and, at baseline, the reference for all later comparisons."
      query: "The scans comprising the {visit} tumor assessment span {span} days. Please confirm the scan dates and whether all scans belong to this assessment."
      tips: "Commonly caused by brain MRI scheduled separately from body CT; confirm the imaging manual's tolerance before raising."
  - id: TE-BL-016
    family: BL
    title: "Lesion location inconsistent with the assigned organ or laterality"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: LLM_ADJUDICATED
    status: PROPOSED_OPTIONAL
    confidence_base_rate: 0.55
    intent: "Detect coding errors between the free-text location and the coded organ/laterality."
    logic: |
      LLM classifies (organ, laterality, location_detail) as consistent / inconsistent / unclear
      with rationale; only "inconsistent" with confidence >= 0.7 raises a finding
    messages:
      review_point: "Anatomical consistency between the coded organ, laterality and the free-text lesion description."
      issue: "Subject {subject_id}: lesion {lesion_id} is coded to {organ} {laterality} but described as \"{location_detail}\"."
      reason: "Organ coding drives the per-organ target lesion limit and the interpretation of new lesions by region. A mismatch can hide a breach of the per-organ limit or misclassify a new lesion."
      query: "Lesion {lesion_id} is recorded at {organ} {laterality} with the description \"{location_detail}\". Please confirm the anatomical location and correct the coding if needed."
      tips: "Laterality errors are the most common subtype and matter most for paired organs (lung, kidney, breast, adnexa)."
  - id: TE-BL-017
    family: BL
    title: "Baseline assessment missing entirely while follow-up assessments exist"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.95
    intent: "No follow-up can be interpreted without a baseline."
    logic: |
      if subject has follow-up assessments and no assessment flagged is_baseline: raise finding
    messages:
      review_point: "Presence of a baseline tumor assessment for every subject with follow-up data."
      issue: "Subject {subject_id}: {n} follow-up tumor assessments are recorded but no baseline assessment exists."
      reason: "Percent change from baseline, the nadir and every response category depend on a baseline. Without it the subject cannot contribute to any efficacy endpoint."
      query: "No baseline tumor assessment is recorded for this subject although follow-up assessments exist. Please enter the baseline assessment or confirm why it was not performed."
      tips: "Check whether the baseline was entered under a screening visit name that failed to map; this is frequently a data-transfer issue rather than missing data."
  - id: TE-FU-001
    family: FU
    title: "Reported sum of diameters does not match the recorded lesions at a follow-up visit"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.97
    required_fields: "reported_responses.sum_of_diameters_reported collected as a site-entered field"
    intent: "Arithmetic verification of the sum at every timepoint."
    logic: |
      for each follow-up assessment:
          if the CRF specification shows the sum is system-derived rather than site-entered:
              deactivate the rule for this study and report NOT_EVALUATED
          else:
              derived = sumOfDiameters(assessment, targets, config)
              if reported_sum is present and |reported_sum - derived.sum| > config.sum_tolerance_mm:
                  raise finding
    messages:
      review_point: "Recomputation of the sum of diameters at each timepoint from the individual target lesion measurements."
      issue: "Subject {subject_id}, {visit}: sum of diameters reported as {reported} mm; recomputed from the {n} target lesions as {derived} mm (difference {difference} mm). Lesion contributions: {lesion_breakdown}."
      reason: "The sum drives percent change from baseline (partial response) and from nadir (progression). A {difference} mm error at this timepoint changes the percent change from {reported_pct}% to {derived_pct}% and the derived response from {reported_response} to {derived_response}."
      query: "The sum of diameters recorded at {visit} ({reported} mm) does not match the sum of the individual target lesion measurements ({derived} mm). Please verify the individual measurements and the recorded sum."
      tips: "Check for a lesion measured but omitted from the sum, a lesion recorded as absent but still included, and nodal lesions entered with the wrong axis."
  - id: TE-FU-002
    family: FU
    title: "Target lesion measurement missing without a not-done reason"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.90
    intent: "Missing data must be explained, not silent."
    logic: |
      if measurement absent or value null and state not in (ABSENT, TOO_SMALL_TO_MEASURE, NOT_EVALUABLE, NOT_DONE)
         or state in (NOT_EVALUABLE, NOT_DONE) with no reason recorded: raise finding
    messages:
      review_point: "Completeness and explanation of missing target lesion measurements."
      issue: "Subject {subject_id}, {visit}: target lesion {lesion_id} has no measurement and no reason recorded."
      reason: "An unexplained missing measurement makes the sum incomplete, which forces the target response to not evaluable and can propagate into a missing timepoint for progression-free survival."
      query: "No measurement is recorded for target lesion {lesion_id} at {visit}. Please enter the measurement or record the reason it could not be assessed."
      tips: "Distinguish \"not evaluable\" (lesion could not be assessed) from \"absent\" (lesion no longer visible); the two have opposite consequences for response."
  - id: TE-FU-003
    family: FU
    title: "Target response reported despite an unevaluable target lesion"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.88
    intent: "Enforce the not-evaluable rule with its progression exception."
    logic: |
      if any target lesion state in (NOT_EVALUABLE, NOT_DONE)
         and reported target_response not in (NE, PD)
         and not partialSumAlreadyExceeds(PD thresholds): raise finding
    messages:
      review_point: "Handling of not-evaluable target lesions in the timepoint response."
      issue: "Subject {subject_id}, {visit}: target lesion {lesion_id} is not evaluable, yet the target response is reported as {reported_response}."
      reason: "When any target lesion cannot be assessed, the sum is incomplete and the true tumor burden is unknown, so the response is not evaluable. The exception is progression: if the measured lesions alone already meet the progression threshold, progressive disease can still be assigned. Here the measured lesions sum to {partial_sum} mm against a nadir of {nadir} mm ({partial_pct}%), which does not reach the progression threshold."
      query: "Target lesion {lesion_id} is recorded as not evaluable at {visit} while the target lesion response is reported as {reported_response}. Please confirm; where a target lesion cannot be assessed, the target response should normally be not evaluable."
      tips: "This is a systematic misunderstanding at many sites: a lesion that is \"not seen because it resolved\" should be recorded as absent, not as not evaluable."
  - id: TE-FU-004
    family: FU
    title: "Implausible measurement change for a single lesion"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: HYBRID
    status: ACTIVE
    confidence_base_rate: 0.45
    intent: "Outlier detection on lesion trajectories."
    logic: |
      for consecutive measurements of the same lesion:
          if |delta| >= config.outlier_abs_mm (default 20) and |pct_delta| >= config.outlier_pct (default 50)
             and interval_days <= config.outlier_window_days (default 90): raise finding
          LLM may downgrade to INFO when a comment explains the change (e.g. cavitation, haemorrhage)
    messages:
      review_point: "Plausibility of the change in an individual lesion between consecutive assessments."
      issue: "Subject {subject_id}: lesion {lesion_id} changes from {prev_value} mm at {prev_visit} to {value} mm at {visit} ({pct_delta}% over {interval} days)."
      reason: "A change of this magnitude over {interval} days is unusual and is more often a transcription error, a unit error, or measurement of a different lesion than true biology. The change moves the sum from {prev_sum} mm to {sum} mm and the derived response from {prev_response} to {response}."
      query: "Lesion {lesion_id} changed from {prev_value} mm to {value} mm between {prev_visit} and {visit}. Please verify the measurement against the imaging report."
      tips: "Genuine large changes do occur — rapid response to targeted therapy, cavitation, haemorrhage into a lesion, or coalescence of adjacent lesions. Look for a comment or a matching change in a neighbouring lesion."
  - id: TE-FU-005
    family: FU
    title: "Lesion recorded as absent and subsequently measured again"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.78
    intent: "Detect and correctly handle reappearance of a resolved lesion."
    logic: |
      if lesion state == ABSENT at visit i and state == PRESENT with value > 0 at visit j > i:
          raise finding (informational when config.reappearance_is_progression is false,
                         escalate when the site also flagged it as a new lesion)
    messages:
      review_point: "Handling of a target lesion that disappeared and later reappeared."
      issue: "Subject {subject_id}: lesion {lesion_id} was recorded as absent at {absent_visit} and measures {value} mm at {visit}."
      reason: "A previously resolved target lesion that reappears re-enters the sum of diameters at its measured size; it is not a new lesion, because it was present at baseline. Progression is then judged against the nadir. If it has instead been recorded as a new lesion, progression will be dated incorrectly and the sum will double-count the disease."
      query: "Lesion {lesion_id} was recorded as absent at {absent_visit} and is measured again at {visit}. Please confirm this is the same baseline target lesion rather than a new lesion, and that it is included in the sum of diameters."
      tips: "Confirm the protocol's position: some protocols treat reappearance after a complete response as progression in itself. The study configuration setting is reappearance_is_progression = {reappearance_is_progression}."
  - id: TE-FU-006
    family: FU
    title: "Inconsistent use of the too-small-to-measure convention"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.70
    intent: "One convention per study."
    logic: |
      if the study contains both TOO_SMALL_TO_MEASURE states and lesions recorded with the
         default value (e.g. 5 mm) under state PRESENT: raise finding at study level
    messages:
      review_point: "Consistency of the convention for lesions that are visible but too small to measure reliably."
      issue: "Study {study_id}: {n_state} records use the too-small-to-measure state while {n_value} records appear to use a fixed {default} mm value under a present state ({examples})."
      reason: "The two conventions produce different sums and different eligibility for complete response. Mixing them makes cross-subject comparison unreliable and can make a complete response unassignable for some subjects and assignable for others with identical imaging."
      query: "Please confirm the convention used for lesions below the limit of reliable measurement at this site, so that the records can be harmonised."
      tips: "Agree the convention centrally and document it in the imaging manual; retrospective harmonisation is usually preferable to leaving the study mixed."
  - id: TE-FU-007
    family: FU
    title: "Assessment interval outside the protocol schedule"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.85
    required_fields: "protocol_config.assessment_schedule (per visit) or the uniform interval fallback"
    intent: "Assessments must follow the protocol calendar so that progression dating is comparable."
    logic: |
      schedule = config.assessment_schedule            # per visit, captured at AC-11 intake
                 # { visit_name: { target_day, window_minus_days, window_plus_days } }
      
      for each assessment a:
          if schedule defines a.visit_name:
              planned = schedule[a.visit_name]
              actual  = days(a.assessment_date - reference_date)
              if actual < planned.target_day - planned.window_minus_days
                 or actual > planned.target_day + planned.window_plus_days:
                     raise finding
          else:                                         # fallback, uniform schedule
              for consecutive assessments:
                  if |interval - config.assessment_interval_days| > config.assessment_window_days:
                      raise finding
      
      guards:
        - suppress where the visit is unscheduled or an early-termination assessment
        - suppress where the subject had progressed or discontinued before the expected date
    messages:
      review_point: "Compliance of tumor assessment timing with the protocol-defined schedule and window."
      issue: "Subject {subject_id}: {interval} days between {prev_visit} ({prev_date}) and {visit} ({date}); the protocol specifies {expected} ± {window} days."
      reason: "Assessment timing determines the resolution of progression dating and, in randomised trials, the comparability of progression-free survival between arms. Systematically late assessments delay progression detection."
      query: "The interval between {prev_visit} and {visit} is {interval} days, outside the protocol window of {expected} ± {window} days. Please confirm the assessment date and whether a protocol deviation has been recorded."
      tips: "Cluster by site: isolated deviations are scheduling reality, but a site with a consistent bias is a monitoring signal."
  - id: TE-FU-008
    family: FU
    title: "Missing scheduled assessment before progression or censoring"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.80
    intent: "Detect gaps that affect progression-free survival censoring."
    logic: |
      if gap between assessments >= 2 * config.assessment_interval_days
         and subject still on treatment during the gap: raise finding
    messages:
      review_point: "Continuity of tumor assessments while the subject remains on study."
      issue: "Subject {subject_id}: no tumor assessment between {prev_date} and {date}, a gap of {gap} days spanning approximately {n_missed} scheduled assessments while the subject remained on treatment."
      reason: "Two or more consecutively missed assessments typically require censoring at the last evaluable assessment in progression-free survival analyses, which reduces the information contributed by this subject and can bias the estimate."
      query: "No tumor assessment is recorded between {prev_date} and {date} although the subject remained on treatment. Please confirm whether assessments were performed and, if so, enter the data; otherwise please record the reason."
      tips: "Cross-check against the visit schedule and any unscheduled visits; assessments performed but entered under an unmapped visit name are a common cause."
  - id: TE-FU-009
    family: FU
    title: "Nodal target lesion recorded as absent or zero"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.95
    intent: "Nodes remain measurable and stay in the sum even when they normalise."
    logic: |
      for each FOLLOW-UP assessment (baseline excluded — a nodal target cannot be absent at
      selection, having required a short axis >= 15 mm):
          if lesion.is_nodal and lesion.category == TARGET
             and (state == ABSENT or value == 0)
             and state != TOO_SMALL_TO_MEASURE:            # ID-02 convention, not an error
                 raise finding
    messages:
      review_point: "Treatment of nodal target lesions that shrink below the pathological threshold."
      issue: "Subject {subject_id}, {visit}: nodal target lesion {lesion_id} ({organ}) is recorded as {state_or_zero}."
      reason: "Under RECIST 1.1 lymph nodes always retain a measurable short axis and are never recorded as absent; they continue to contribute their short axis to the sum even when it falls below 10 mm. The sum therefore need not reach zero for a complete response — what is required is that every pathological node has a short axis below 10 mm. Recording the node as zero understates the sum by its true short axis and can produce a false partial response or complete response."
      query: "Nodal target lesion {lesion_id} is recorded as {state_or_zero} at {visit}. Please confirm whether this node was measured at this visit and, if so, record the short axis from the source imaging report. If it could not be measured, please record the reason."
      tips: "This is the single most common nodal error and it usually reflects a well-intentioned attempt to make the arithmetic produce a complete response. Explain the rule to the site rather than only requesting the correction."
  - id: TE-FU-010
    family: FU
    title: "Non-target lesion state missing at a follow-up assessment"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.86
    intent: "Non-target lesions must be assessed qualitatively at every timepoint."
    logic: |
      if non-target lesion has no non_target_state at a performed assessment: raise finding
    messages:
      review_point: "Completeness of qualitative non-target lesion assessment at each timepoint."
      issue: "Subject {subject_id}, {visit}: no assessment is recorded for non-target lesion {lesion_id} ({organ})."
      reason: "The non-target response contributes to the overall timepoint response, and unequivocal progression of non-target disease is sufficient for progression on its own. A missing non-target assessment leaves the overall response underdetermined."
      query: "No assessment is recorded for non-target lesion {lesion_id} at {visit}. Please record the status of this lesion."
      tips: "Sites often assess non-target disease collectively rather than lesion by lesion; check whether the eCRF expects a per-lesion or an overall non-target response."
  - id: TE-FU-011
    family: FU
    title: "Tumor assessment recorded after death or after the end of study participation"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.90
    required_fields: "subjects.death_date or subjects.discontinuation_date"
    intent: "Temporal plausibility against subject-level dates."
    logic: |
      if assessment_date > death_date
         or assessment_date > end_of_participation_date:
             raise finding
      
      guards:
        - no finding where assessment_date == death_date: the assessment may legitimately
          precede death on the same day
        - no finding where either date is partial to the point that the comparison cannot
          be made — report NOT_EVALUATED rather than guessing
    messages:
      review_point: "Consistency of tumor assessment dates with subject disposition and vital status."
      issue: "Subject {subject_id}: tumor assessment dated {date} at {visit}, after the recorded {reference_event} of {reference_date}."
      reason: "An assessment dated after death or well beyond the end of follow-up indicates an error in one of the two dates. Either error affects analysis: an incorrect assessment date can move the progression date, and an incorrect death date affects survival analysis."
      query: "The {visit} tumor assessment is dated {date}, after the recorded {reference_event} ({reference_date}). Please verify both dates."
      tips: "Post-treatment follow-up assessments are legitimate in many protocols; confirm the follow-up period before treating a post-discontinuation assessment as an error."
  - id: TE-FU-012
    family: FU
    title: "New lesion recorded with an identification date earlier than the visit at which it was first reported"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.75
    intent: "New lesion timing consistency."
    logic: |
      if new lesion identified_at assessment date < the date of the assessment where it first appears
         in measurements: raise finding
    messages:
      review_point: "Consistency between the date a new lesion was identified and the assessment at which it was reported."
      issue: "Subject {subject_id}: new lesion {lesion_id} is dated {identified_date} but first appears in the assessment data at {visit} ({visit_date})."
      reason: "The progression date is taken from the first assessment at which the new lesion was observed. An inconsistency between these dates produces the wrong progression date and therefore the wrong progression-free survival time."
      query: "New lesion {lesion_id} has an identification date of {identified_date} but is first reported at {visit} ({visit_date}). Please confirm the date the lesion was first observed."
      tips: "Where the lesion was visible in retrospect on an earlier scan, the progression date is normally the earlier scan; this requires a documented radiology decision."
  - id: TE-FU-013
    family: FU
    title: "Follow-up scans span more days than permitted"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.58
    required_fields: "assessments.scan_dates"
    intent: "Same coherence check as TE-BL-015, applied to follow-up assessments."
    logic: |
      span = max(scan_dates) - min(scan_dates); if span > config.scan_span_max_days: raise finding
    messages:
      review_point: "Temporal coherence of the scans composing a follow-up assessment."
      issue: "Subject {subject_id}, {visit}: component scans span {span} days ({earliest} to {latest})."
      reason: "Widely separated component scans mean that different parts of the tumor burden are measured at different times, which affects the sum and may affect the progression date."
      query: "The scans comprising the {visit} assessment span {span} days. Please confirm the scan dates."
      tips: "Where the span is unavoidable, the assessment date convention (earliest scan or latest scan) should be applied consistently across the study."
  - id: TE-FU-014
    family: FU
    title: "Identical measurements repeated across three or more consecutive visits"
    guideline: "RECIST 1.1 + iRECIST"
    severity: INFO
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.55
    intent: "Detect carried-forward values rather than genuine measurement."
    logic: |
      if ALL target lesions for a subject carry identical values at >= 3 consecutive
         assessments, and at least one lesion is > config.identical_value_min_mm (default 15):
             raise finding
      
      guards:
        - no finding where only some lesions repeat: genuinely stable disease does this
        - no finding where the assessments are within config.identical_min_interval_days
          of each other (default 21), where a real repeat read is plausible
    messages:
      review_point: "Detection of measurements that may have been carried forward rather than re-measured."
      issue: "Subject {subject_id}: lesion {lesion_id} measures exactly {value} mm at {visits}."
      reason: "Identical measurements of a lesion of this size across several timepoints are uncommon given normal measurement variability, and may indicate that a previous value was copied rather than the lesion re-measured. If so, the sum does not reflect the current tumor burden."
      query: "Lesion {lesion_id} is recorded as exactly {value} mm at {visits}. Please confirm that the lesion was measured at each assessment."
      tips: "Small and stable lesions genuinely produce repeated values; this check is deliberately informational and should be reviewed in the context of the whole subject rather than raised as a query in isolation."
  - id: TE-IR-001
    family: IR
    title: "RECIST 1.1 progression not recorded as unconfirmed progression under iRECIST"
    guideline: "iRECIST only"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.92
    intent: "First progression under iRECIST is iUPD, never iCPD."
    logic: |
      if guideline includes iRECIST and RECIST 1.1 criteria for PD are met at this timepoint
         and no prior iUPD exists
         and reported irecist_response != iUPD: raise finding
    messages:
      review_point: "Assignment of unconfirmed progression when RECIST 1.1 progression criteria are first met under iRECIST."
      issue: "Subject {subject_id}, {visit}: RECIST 1.1 progression criteria are met ({pd_driver_description}) and the iRECIST response is recorded as {reported_irecist}, with no preceding unconfirmed progression."
      reason: "Under iRECIST, the first timepoint at which RECIST 1.1 progression criteria are met is assigned unconfirmed progression (iUPD). Confirmed progression (iCPD) can only be assigned at a subsequent assessment that demonstrates further worsening. Recording confirmed progression at first occurrence removes the confirmation step that iRECIST exists to provide, and may lead to treatment being discontinued for pseudoprogression."
      query: "The iRECIST response at {visit} is recorded as {reported_irecist}. The lesion measurements at this visit show an increase against the smallest sum recorded on study ({nadir_sum} mm). Please confirm the iRECIST response recorded for this visit against the source imaging report."
      tips: "The commonest cause is the site applying RECIST 1.1 habits to an iRECIST study. Where both RECIST 1.1 and iRECIST responses are collected, the RECIST 1.1 field correctly reads PD while the iRECIST field should read iUPD — the two are not in conflict."
  - id: TE-IR-002
    family: IR
    title: "Confirmatory assessment after unconfirmed progression missing or outside the window"
    guideline: "iRECIST only"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.85
    intent: "iUPD must be followed by a confirmatory assessment within the protocol window."
    logic: |
      for each iUPD timepoint:
          next = next assessment for this subject
          if next is None and subject still on treatment: raise finding (missing confirmation)
          elif next exists and interval not in [config.irecist_confirmation_window_days_min,
                                                config.irecist_confirmation_window_days_max]: raise finding
    messages:
      review_point: "Timing of the confirmatory assessment following unconfirmed progression."
      issue: "Subject {subject_id}: unconfirmed progression recorded at {iupd_visit} ({iupd_date}); {confirmation_situation}."
      reason: "iRECIST requires the confirmatory assessment between {window_min} and {window_max} days after unconfirmed progression. Assessing too early risks confirming transient pseudoprogression as true progression; assessing too late leaves the subject on a potentially ineffective therapy and leaves the progression date ambiguous. Without a confirmatory assessment, progression remains unconfirmed and the subject's progression status for analysis is indeterminate."
      query: "Unconfirmed progression was recorded at {iupd_visit} on {iupd_date}. {confirmation_situation}. Please confirm whether a confirmatory tumor assessment was performed and enter the data, or record the reason it was not performed."
      tips: "Where the subject discontinued treatment at unconfirmed progression, no confirmation is expected and this finding should be rejected with that reason; check the disposition data before querying."
  - id: TE-IR-003
    family: IR
    title: "Confirmed progression assigned without meeting the confirmation criteria"
    guideline: "iRECIST only"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.90
    intent: "iCPD requires further worsening in the category that drove iUPD."
    logic: |
      if reported_irecist == iCPD:
          verify per driver recorded at the preceding iUPD:
            TARGET     -> sum >= iUPD.sum + config.icpd_target_increment_mm
            NON_TARGET -> further unequivocal worsening recorded
            NEW_LESION -> new lesion sum >= iUPD.new_lesion_sum + config.icpd_new_lesion_increment_mm
                          or additional new lesions
            or a new driver now independently meets RECIST 1.1 progression criteria
          if none satisfied: raise finding
    messages:
      review_point: "Criteria for confirming progression under iRECIST."
      issue: "Subject {subject_id}, {visit}: confirmed progression is recorded. Unconfirmed progression was driven by {driver} at {iupd_visit}; at this assessment {confirmation_evidence}."
      reason: "Confirmation of progression requires further worsening in the category that drove the unconfirmed progression: an increase of at least {target_increment} mm in the target lesion sum relative to the unconfirmed progression timepoint, further unequivocal worsening of non-target disease, an increase of at least {new_increment} mm in the sum of new measurable lesions, or the appearance of additional new lesions. A new category independently meeting RECIST 1.1 progression criteria also confirms. None of these is evident here, so the response should remain unconfirmed progression or reset according to the current burden."
      query: "Confirmed progression is recorded at {visit}. Unconfirmed progression was recorded at {iupd_visit}, driven by {driver}, and the current assessment shows {confirmation_evidence}. Please confirm the response recorded at {visit} against the source imaging report."
      tips: "Note the reference point: confirmation compares against the unconfirmed progression timepoint, not against the nadir. This differs from RECIST 1.1 and is a frequent source of confusion."
  - id: TE-IR-004
    family: IR
    title: "New lesion measurements added to the baseline target sum"
    guideline: "iRECIST only"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.93
    intent: "iRECIST tracks new lesions separately."
    logic: |
      if reported_sum at a timepoint equals derived baseline-target sum + new lesion measurements
         (within tolerance) rather than the baseline-target sum alone: raise finding
    messages:
      review_point: "Separate recording of new lesion measurements from the baseline target lesion sum under iRECIST."
      issue: "Subject {subject_id}, {visit}: the reported sum of {reported} mm matches the baseline target sum ({target_sum} mm) plus the new lesion measurements ({new_sum} mm) rather than the target sum alone."
      reason: "Under iRECIST, new lesions are recorded and measured separately from the baseline target lesions, with their own sum of up to five new measurable lesions, two per organ. They are never added to the baseline target sum, because the baseline sum must remain comparable to baseline for response assessment, while the new lesion sum is used to judge confirmation of progression. Combining them corrupts both."
      query: "The sum of diameters recorded at {visit} appears to include measurements of lesions recorded as new. Please confirm which lesions are included in the sum of diameters at this visit."
      tips: "Confirm the eCRF design supports separate new lesion recording; where it does not, this is a study set-up issue affecting every iRECIST subject rather than a site error."
  - id: TE-IR-005
    family: IR
    title: "Response reset after unconfirmed progression not applied correctly"
    guideline: "iRECIST only"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.86
    intent: "When progression is not confirmed, the response returns to iCR/iPR/iSD against the original nadir."
    logic: |
      if a timepoint follows an iUPD, confirmation criteria are NOT met,
         and reported_irecist not in (iCR, iPR, iSD, iUPD, iNE): raise finding
      also verify the reset response was derived against the ORIGINAL nadir, not against the iUPD sum
    messages:
      review_point: "Reassignment of response when progression is not confirmed at the next assessment."
      issue: "Subject {subject_id}, {visit}: unconfirmed progression at {iupd_visit} was not confirmed, and the response is recorded as {reported_irecist}; the derived response is {derived_irecist} (sum {sum} mm against the nadir of {nadir_sum} mm at {nadir_visit})."
      reason: "If confirmation criteria are not met, the subject's response resets to iCR, iPR or iSD according to the current tumor burden measured against the original nadir. The nadir is not reset by the unconfirmed progression, so a later increase can again produce unconfirmed progression. This is the mechanism by which iRECIST accommodates pseudoprogression."
      query: "Unconfirmed progression was recorded at {iupd_visit} and was not confirmed at {visit}. The iRECIST response at {visit} is recorded as {reported_irecist}, with a sum of diameters of {sum} mm. Please confirm the iRECIST response recorded for this visit."
      tips: "Multiple episodes of unconfirmed progression are permitted and are not an error. What is not permitted is treating the unconfirmed progression sum as the new reference."
  - id: TE-IR-006
    family: IR
    title: "New measurable lesions exceed the iRECIST limits"
    guideline: "iRECIST only"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.82
    intent: "At most five new measurable lesions, two per organ."
    logic: |
      if count(new measurable lesions) > config.max_new_target_lesions_total
         or count per organ > config.max_new_target_lesions_per_organ: raise finding
    messages:
      review_point: "Limits on the number of new measurable lesions recorded and measured under iRECIST."
      issue: "Subject {subject_id}: {n} new measurable lesions are recorded ({per_organ_breakdown}); iRECIST permits up to {max_total} in total and {max_per_organ} per organ."
      reason: "The new lesion sum is used to judge confirmation of progression, so it must be constructed consistently. Additional new lesions beyond the limits are recorded as new non-target lesions rather than measured."
      query: "{n} new measurable lesions are recorded for this subject. This study records up to {max_total} new measurable lesions in total and {max_per_organ} per organ, with any further new lesions recorded as non-target. Please review the new lesion records."
      tips: "The appearance of numerous new lesions is itself strong evidence of true progression, so this finding is usually a recording issue rather than a clinical question."
  - id: TE-IR-007
    family: IR
    title: "Assessments continue after confirmed progression without documented rationale"
    guideline: "iRECIST only"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.84
    intent: "iCPD is terminal for response derivation."
    logic: |
      if assessments exist after an iCPD timepoint and are assigned iRECIST responses
         other than iCPD: raise finding
    messages:
      review_point: "Handling of assessments performed after confirmed progression."
      issue: "Subject {subject_id}: confirmed progression recorded at {icpd_visit} ({icpd_date}); subsequent assessments at {later_visits} carry responses of {later_responses}."
      reason: "Confirmed progression is the terminal response state. Later assessments may be collected for follow-up, but assigning a non-progression response after confirmed progression is inconsistent and risks the later response being carried into the best overall response derivation."
      query: "Assessments after the confirmed progression at {icpd_visit} carry responses of {later_responses}. Please confirm the progression status and the response assessments recorded after it."
      tips: "Check whether the earlier assessment was in fact unconfirmed rather than confirmed progression; a mislabelled iCPD is the more likely error."
  - id: TE-IR-008
    family: IR
    title: "Treatment continued beyond unconfirmed progression without documented clinical stability"
    guideline: "iRECIST only"
    severity: MAJOR
    mode: HYBRID
    status: PROPOSED_OPTIONAL
    confidence_base_rate: 0.48
    required_fields: "cross_domain.exposure, cross_domain.performance_status or clinical stability assessment"
    intent: "iRECIST permits continuation only for clinically stable subjects."
    logic: |
      if treatment continued after an iUPD
         and no record of the clinical stability assessment exists at that timepoint: raise finding
    messages:
      review_point: "Documentation of clinical stability when treatment continues beyond unconfirmed progression."
      issue: "Subject {subject_id}: treatment continued after unconfirmed progression at {iupd_visit}, with no recorded assessment of clinical stability."
      reason: "iRECIST permits treatment beyond unconfirmed progression only where the subject is clinically stable: no decline in performance status, no worsening of symptoms attributable to disease, and no need for intensified management. The documentation supports both subject safety and the interpretation of the subsequent assessment."
      query: "Treatment continued after unconfirmed progression at {iupd_visit}. Please confirm that the subject was assessed as clinically stable at that time and that this is documented."
      tips: "This is a protocol compliance point as much as a data point; where the eCRF has no field for it, escalate to the monitoring team rather than issuing a data query."
  - id: TE-IR-009
    family: IR
    title: "RECIST 1.1 and iRECIST responses collected in parallel are mutually inconsistent"
    guideline: "iRECIST only"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.80
    intent: "Where both are collected, the iRECIST value must follow from the RECIST 1.1 value and the state history."
    logic: |
      expected = irecistStateMachine(...) applied to the reported RECIST 1.1 responses
      if reported_irecist != expected: raise finding
    messages:
      review_point: "Consistency between the parallel RECIST 1.1 and iRECIST response assessments."
      issue: "Subject {subject_id}, {visit}: RECIST 1.1 response {r11_response}, iRECIST response {reported_irecist}; the iRECIST response derived from the RECIST 1.1 sequence is {expected_irecist}."
      reason: "The iRECIST assessment is derived from the same underlying measurements as the RECIST 1.1 assessment, differing only in the treatment of progression and new lesions. Given the RECIST 1.1 result at this timepoint and the preceding response history, the iRECIST response should be {expected_irecist}."
      query: "The RECIST 1.1 and iRECIST responses recorded at {visit} are {r11_response} and {reported_irecist}. Please confirm both response fields for this visit against the source imaging report."
      tips: "Where the two fields are on separate forms completed by different people, expect systematic divergence at a site; treat that as a training signal rather than a per-record query."
  - id: TE-IR-010
    family: IR
    title: "Study uses immunotherapy but responses are assessed under RECIST 1.1 only"
    guideline: "iRECIST only"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.88
    required_fields: "protocol_config.guideline_version, cross_domain.treatment class"
    intent: "Detect a study-level configuration mismatch."
    logic: |
      if protocol specifies iRECIST and no iRECIST responses are present in the data,
         or the reverse: raise study-level finding
    messages:
      review_point: "Alignment between the response criteria specified in the protocol and the response data collected."
      issue: "Study {study_id}: the protocol specifies {configured_guideline}, but {observed_situation}."
      reason: "If iRECIST is specified but not collected, pseudoprogression cannot be distinguished from true progression, and subjects may be discontinued prematurely. If iRECIST is collected but not specified in the protocol, the analysis convention is undefined. Either way the endpoint derivation is at risk across the whole study."
      query: "Not applicable: this is a study set-up finding for the study team rather than a site query."
      tips: "Raise with the study data manager and the biostatistician; resolution usually requires a database change rather than data correction."
  - id: TE-QM-001
    family: QM
    title: "Finding already covered by an open query"
    guideline: "RECIST 1.1 + iRECIST"
    severity: INFO
    mode: HYBRID
    status: ACTIVE
    confidence_base_rate: 0.90
    intent: ""
    logic: |
      classification produced by the query reconciler; see queryReconciliation
    messages:
      review_point: "Suppression of findings already covered by an outstanding query."
      issue: "Subject {subject_id}, {visit}: finding {source_finding_id} is already covered by open query {query_id} raised on {opened_date}."
      reason: "Re-issuing a query that is already outstanding creates duplicate work at the site and confuses the audit trail. The finding is retained and linked, but is suppressed from the default worklist until the query is answered."
      query: "Not applicable: no new query is required."
      tips: "If the outstanding query is materially different in scope from this finding, disposition the finding as NEW manually and issue a distinct query."
  - id: TE-QM-002
    family: QM
    title: "Query answered or closed but the answer does not justify the current data"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: LLM_ADJUDICATED
    status: ACTIVE
    confidence_base_rate: 0.75
    intent: "Assess whether the site's answer to an earlier query reasonably explains the current data. Escalate only where it does not."
    logic: |
      if a query matching this finding has status ANSWERED or CLOSED
         and the finding still evaluates as true against the current data:
             assessment = P-ASSESS-ANSWER(query_text, answer_text, current field values)
             if assessment.classification == JUSTIFIES_CURRENT_DATA and confidence >= 0.70:
                 if severity in (CRITICAL, MAJOR):
                     surface, flagged 'possibly justified', with the answer quoted
                 else:
                     suppress permanently as JUSTIFIED_BY_ANSWER; record the justification
             elif assessment.classification == CORRECTION_PROMISED_NOT_MADE:
                 surface at original severity, noting the outstanding correction
             else:
                 escalate severity by one level (capped at CRITICAL) and surface
    messages:
      review_point: "Whether an answered or closed query actually resolved the underlying data issue, or reasonably justified leaving the data as it is."
      issue: "Subject {subject_id}, {visit}: query {query_id} was {query_status} on {resolution_date} with the answer \"{answer_summary}\", but the data still shows {current_state}."
      reason: "The query was resolved without the data being corrected. The site's answer does not explain why the current values are correct, so the issue survives into the locked database. Where an answer does justify the data, this finding is suppressed instead and the justification is recorded against the record."
      query: "Query {query_id} regarding {issue_summary} was answered on {resolution_date}, but the data still shows {current_state}. Please clarify: if the data is correct as entered, please explain the basis; otherwise please make the correction."
      tips: "Read the original answer in full before re-querying — it is quoted above. Where the site confirmed the data is correct and the explanation holds, disposition this as justified so it is not raised again at the next data cut."
  - id: TE-QM-003
    family: QM
    title: "Issue recurs after a previous resolution"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.82
    intent: ""
    logic: |
      if a finding with this dedupe key was RESOLVED in an earlier run
         and evaluates true again in the current run: mark RECURRENT and escalate
    messages:
      review_point: "Recurrence of a previously resolved issue."
      issue: "Subject {subject_id}, {visit}: this issue was resolved on {previous_resolution_date} (run {previous_run_id}) and is present again in the current data."
      reason: "A recurrence usually means either that a data correction was reverted, or that a subsequent data entry reintroduced the same error. Both are worth understanding, because the same cause is likely to affect other records."
      query: "This issue was previously raised and resolved on {previous_resolution_date}, and is present again in the current data. Please confirm the current value and clarify the reason for the change."
      tips: "Compare the audit trail of the affected field across the two data cuts; a reverted correction and a fresh error need different responses."
  - id: TE-QM-004
    family: QM
    title: "Critical query outstanding beyond the ageing threshold"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.85
    intent: ""
    logic: |
      if a query linked to a CRITICAL finding is OPEN for > config.query_aging_days (default 30):
         raise finding
    messages:
      review_point: "Ageing of outstanding queries linked to endpoint-critical findings."
      issue: "Subject {subject_id}: query {query_id} concerning {issue_summary} has been open for {days} days."
      reason: "Endpoint-critical data cannot be locked while the query is outstanding, and late resolution compresses the timeline before database lock. Ageing queries on response data are a leading cause of lock delay."
      query: "Not applicable: this finding is for the study team's query management rather than a new site query."
      tips: "Escalate through the monitoring team rather than by reissuing the query."
  - id: TE-QM-005
    family: QM
    title: "Query answer does not address the question asked"
    guideline: "RECIST 1.1 + iRECIST"
    severity: INFO
    mode: LLM_ADJUDICATED
    status: ACTIVE
    confidence_base_rate: 0.55
    intent: ""
    logic: |
      LLM classifies the answer against the query as
         {addresses: full | partial | none, intent: data_will_be_corrected | data_confirmed_correct |
          clarification_provided | unrelated, confidence}
      raise when addresses == none or partial with confidence >= 0.7
    messages:
      review_point: "Responsiveness of query answers to the question asked."
      issue: "Subject {subject_id}: query {query_id} asked \"{query_summary}\"; the answer \"{answer_summary}\" appears to {addresses_description}."
      reason: "An unresponsive answer that is nonetheless accepted closes the query without resolving the underlying data question, so the issue survives into the locked database."
      query: "Thank you for the response to query {query_id}. The original question concerned {query_summary}; could you please also confirm {outstanding_point}?"
      tips: "Site answers are often correct but terse. Read the original answer in full before re-querying; the model flags candidates rather than making the determination."
  - id: TE-QM-006
    family: QM
    title: "Data changed after a query but a new inconsistency was introduced"
    guideline: "RECIST 1.1 + iRECIST"
    severity: INFO
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.72
    intent: ""
    logic: |
      if a data value changed between runs in response to a query
         and a NEW finding with a different rule id now exists on the same record: link and raise
    messages:
      review_point: "Verification that data corrections did not introduce new inconsistencies."
      issue: "Subject {subject_id}, {visit}: {field} was changed from {old_value} to {new_value} following query {query_id}; the record now triggers {new_rule_id} ({new_rule_title})."
      reason: "Corrections made in isolation frequently break a dependent value — most often a lesion measurement corrected without the sum or the response being updated. The correction should be applied consistently across the dependent fields."
      query: "Following the correction to {field} at {visit}, {new_issue_summary}. Please review the related fields so the assessment is internally consistent."
      tips: "This is why measurement corrections should always be reviewed together with the sum and the response for the same timepoint, and for all later timepoints if the nadir moved."
  - id: TE-RS-001
    family: RS
    title: "Reported target lesion response does not match the derived response"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.96
    intent: "The central check: recompute the target response and compare."
    logic: |
      derived = targetResponse(...)
      if reported_target_response != derived and derived is not NOT_APPLICABLE: raise finding
      severity CRITICAL when the mismatch changes the overall response, MAJOR otherwise
    messages:
      review_point: "Derivation of the target lesion response from the sum of diameters, the baseline sum and the nadir."
      issue: "Subject {subject_id}, {visit}: target lesion response is reported as {reported} but derives as {derived}. Sum of diameters {sum} mm; baseline {baseline_sum} mm ({pct_baseline}%); nadir {nadir_sum} mm at {nadir_visit} ({pct_nadir}%, absolute change {abs_nadir} mm)."
      reason: "{derivation_explanation}"
      query: "The target lesion response recorded at {visit} is {reported}, while the individual lesion measurements recorded for the same visit sum to {sum} mm. Please review the recorded response together with the lesion measurements against the source imaging report, and correct whichever does not match the source."
      tips: "Before querying the response, confirm the measurements themselves: a response mismatch is frequently a symptom of a measurement or sum error already flagged for this subject. Check the linked findings for this subject first."
  - id: TE-RS-002
    family: RS
    title: "Progression declared on a relative increase without the required absolute increase"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.95
    intent: "Enforce the 5 mm absolute criterion alongside the 20% relative criterion."
    logic: |
      if reported_target_response == PD
         and pct_from_nadir >= config.pd_relative_increase_pct
         and abs_from_nadir_mm < config.pd_absolute_increase_mm: raise finding
    messages:
      review_point: "Application of both progression criteria: a relative increase of at least 20% and an absolute increase of at least 5 mm from the nadir."
      issue: "Subject {subject_id}, {visit}: progression is reported. The sum increased from a nadir of {nadir_sum} mm to {sum} mm, a {pct_nadir}% increase but only {abs_nadir} mm in absolute terms."
      reason: "RECIST 1.1 requires both a relative increase of at least {pd_pct}% and an absolute increase of at least {pd_abs} mm from the nadir. The absolute criterion was introduced precisely for small tumor burdens, where a 20% increase can fall within measurement variability. Here the absolute increase of {abs_nadir} mm does not reach {pd_abs} mm, so the derived response is {derived}."
      query: "Progressive disease is recorded at {visit}. The sum of diameters has increased from {nadir_sum} mm at {nadir_visit} to {sum} mm, a change of {abs_nadir} mm. Please confirm what the progression assessment at this visit was based on — the target lesion measurements, a new lesion, or worsening of non-target disease."
      tips: "Confirm first whether progression was actually driven by a new lesion or by non-target progression, in which case the response is correct and this finding can be rejected. This check applies only to progression driven by the target sum."
  - id: TE-RS-003
    family: RS
    title: "Progression assessed against baseline rather than against the nadir"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.96
    intent: "Detect the classic error of comparing to baseline when the tumor shrank first."
    logic: |
      if reported_target_response != PD
         and pct_from_nadir >= config.pd_relative_increase_pct
         and abs_from_nadir_mm >= config.pd_absolute_increase_mm:
             raise finding
      
             # discriminator, not a gate — selects the message and adjusts confidence
             if pct_from_baseline < config.pd_relative_increase_pct:
                 variant = COMPARED_AGAINST_BASELINE   # confidence x 1.10
             else:
                 variant = PROGRESSION_NOT_APPLIED     # confidence unchanged
    messages:
      review_point: "Use of the nadir, rather than baseline, as the reference for progression."
      issue: "Subject {subject_id}, {visit}: target response is reported as {reported}. The sum is {sum} mm, which is {pct_baseline}% relative to baseline ({baseline_sum} mm) but {pct_nadir}% relative to the nadir of {nadir_sum} mm recorded at {nadir_visit} — an absolute increase of {abs_nadir} mm."
      reason: "Progression is assessed against the smallest sum recorded on study, including baseline, not against baseline itself. Because this subject responded before progressing, the comparison against baseline still looks favourable while the comparison against the nadir meets the progression criteria. The derived response is progressive disease."
      query: "At {visit} the sum of diameters is {sum} mm, compared with the smallest sum recorded on study of {nadir_sum} mm at {nadir_visit}. The response recorded at {visit} is {reported}. Please confirm the response assessment for this visit against the source imaging report."
      tips: "This is the most consequential single error class in tumor data: it delays or entirely misses the progression date and directly biases progression-free survival. Always check the nadir visit shown above is itself a complete assessment."
  - id: TE-RS-004
    family: RS
    title: "Complete response reported while measurable disease persists"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.94
    intent: "Enforce the full complete response definition, including nodal short axis."
    logic: |
      if reported_target_response == CR and (
            any non-nodal target with state != ABSENT
         or any nodal target with short axis >= config.pathological_node_threshold_mm
         or any target with state in (TOO_SMALL_TO_MEASURE, NOT_EVALUABLE)): raise finding
    messages:
      review_point: "Conditions required for a complete response of target lesions."
      issue: "Subject {subject_id}, {visit}: complete response is reported for target lesions, but {blocking_description} (lesion {lesion_id}: {value} mm, state {state})."
      reason: "A complete response of target lesions requires the disappearance of all non-nodal target lesions and a reduction of every pathological lymph node, whether target or non-target, to a short axis below {node_threshold} mm. A lesion that is still visible, including one recorded as too small to measure, is not a disappearance."
      query: "A complete response is recorded at {visit}, but {blocking_description}. Please review the response assessment and the individual lesion records."
      tips: "Note the asymmetry that causes most of these: the sum of diameters can be very small without a complete response being appropriate, because nodes retain a short axis. Conversely, complete response does not require the sum to be zero."
  - id: TE-RS-005
    family: RS
    title: "Reported non-target response does not match the derived response"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.93
    intent: "Recompute the non-target response and compare."
    logic: |
      derived = nonTargetResponse(...)
      if reported_non_target_response != derived: raise finding
    messages:
      review_point: "Derivation of the non-target lesion response from the individual non-target lesion states."
      issue: "Subject {subject_id}, {visit}: non-target response is reported as {reported} but derives as {derived}. Lesion states: {non_target_breakdown}."
      reason: "{derivation_explanation}"
      query: "The non-target lesion response recorded at {visit} is {reported}, while the individual non-target lesion assessments ({non_target_breakdown}) correspond to {derived}. Please review."
      tips: "A complete response of non-target disease additionally requires every pathological lymph node to be below 10 mm short axis, and where the protocol uses tumor markers, normalisation of those markers."
  - id: TE-RS-006
    family: RS
    title: "Non-target complete response reported while a pathological node persists"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.88
    intent: "Nodal condition for non-target complete response."
    logic: |
      if reported_non_target_response == CR
         and any non-target node with short axis >= config.pathological_node_threshold_mm: raise finding
    messages:
      review_point: "Nodal condition for a complete response of non-target disease."
      issue: "Subject {subject_id}, {visit}: non-target complete response is reported while node {lesion_id} ({organ}) measures {value} mm short axis."
      reason: "A complete response requires all lymph nodes, target and non-target alike, to have reduced to a short axis below {node_threshold} mm. A node of {value} mm remains pathological, so the non-target response is Non-CR/Non-PD."
      query: "A complete response of non-target lesions is recorded at {visit}, but node {lesion_id} measures {value} mm in short axis. Please review the non-target response."
      tips: "Non-target nodes are often not measured at all; where the eCRF does not capture a short axis for non-target nodes, this check depends on the radiology narrative and may need to be raised as a clarification rather than a correction."
  - id: TE-RS-007
    family: RS
    title: "Unequivocal non-target progression reported in a subject with responding or stable measurable disease"
    guideline: "RECIST 1.1 + iRECIST"
    severity: INFO
    mode: HYBRID
    status: ACTIVE
    confidence_base_rate: 0.45
    intent: "Apply the guideline's \"exceptional circumstance\" test."
    logic: |
      if non_target_response == PD and target_response in (CR, PR, SD) and new_lesion != YES:
          raise finding
          LLM assesses the recorded non-target descriptions for evidence of substantial overall
          worsening; strong evidence downgrades to INFO
    messages:
      review_point: "Threshold for declaring unequivocal progression of non-target disease when measurable disease is present."
      issue: "Subject {subject_id}, {visit}: unequivocal progression of non-target disease is reported while the target lesion response is {target_response} (sum {sum} mm, {pct_nadir}% from nadir) and no new lesion is recorded. Non-target findings: {non_target_breakdown}."
      reason: "RECIST states that where measurable disease is present, unequivocal progression based on non-target disease alone should be an exceptional circumstance: the increase in overall tumor burden must be comparable in magnitude to the increase that would be required to declare progression for measurable disease. A modest increase in one non-target lesion is not sufficient, particularly while the target lesions are {target_response}."
      query: "Progression of non-target disease is recorded at {visit} while the target lesions are recorded as {target_response}. Please provide the radiological description supporting the non-target assessment at this visit, from the source imaging report."
      tips: "Genuine cases exist — for example a marked increase in a pleural effusion or in lymphangitic disease. The question to the site is not \"is this wrong\" but \"what supports unequivocal\". Where the answer supports it, accept and record the rationale so the same finding is not re-raised."
  - id: TE-RS-008
    family: RS
    title: "Reported overall response does not match the RECIST overall response table"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.95
    intent: "The overall response must follow from its three components."
    logic: |
      derived = overallTimepointResponse(reported_target, reported_non_target,
                                         reported_new, has_measurable)
      if reported_overall != derived:
          finding.expected_driver = the component that determines derived
                                    (target / non-target / new lesion)
      
          if a finding from TE-RS-001, TE-RS-005 or TE-RS-009 is open for this assessment:
              attach as a cascade child of that finding; do not raise a separate query
          else:
              raise finding, naming expected_driver and the component values used
      
      note: computed from the REPORTED components, so this rule isolates table-application
            errors from measurement errors, which are covered by TE-RS-001 and TE-RS-005
    messages:
      review_point: "Application of the RECIST overall response table to the reported target, non-target and new lesion components."
      issue: "Subject {subject_id}, {visit}: overall response is reported as {reported_overall}, while the recorded components (target {target}, non-target {non_target}, new lesion {new_lesion}) correspond to {derived_overall}."
      reason: "{table_explanation}"
      query: "The overall response recorded at {visit} is {reported_overall}, with target lesion response {target}, non-target response {non_target} and new lesions {new_lesion} recorded at the same visit. Please review the overall response against these components and correct whichever does not reflect the assessment."
      tips: "The combinations most often mis-applied are: target complete response with persisting non-target disease, which is a partial response rather than a complete response; and any new lesion, which is progression regardless of the target and non-target results."
  - id: TE-RS-009
    family: RS
    title: "New lesion flag inconsistent with recorded new lesions"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.90
    intent: "Cross-check the flag against the lesion records."
    logic: |
      if new_lesion_flag == YES and no lesion with category NEW at this assessment: raise finding
      if new_lesion_flag == NO  and a lesion with category NEW is first recorded here: raise finding
    messages:
      review_point: "Consistency between the new lesion indicator and the recorded new lesion identifications."
      issue: "Subject {subject_id}, {visit}: the new lesion indicator is {flag} while {lesion_situation}."
      reason: "A new lesion is sufficient for progression on its own. If the indicator and the lesion records disagree, either progression has been declared without a documented lesion, or a documented new lesion has not been reflected in the response — both change the progression date."
      query: "The new lesion indicator at {visit} is recorded as {flag} while {lesion_situation}. Please reconcile the new lesion records with the response assessment."
      tips: "Check whether the lesion was recorded as a new lesion at a later visit than the one where it was first seen; the progression date follows the first observation."
  - id: TE-RS-010
    family: RS
    title: "New lesion recorded but overall response is not progression"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: RETIRED
    confidence_base_rate: 0.94
    intent: "A confirmed new lesion always means progression under RECIST 1.1."
    logic: |
      if new_lesion_flag == YES and reported_overall != PD: raise finding
         (under iRECIST the expected value is iUPD; see TE-IR-001)
    messages:
      review_point: "Effect of an unequivocal new lesion on the overall timepoint response."
      issue: "Subject {subject_id}, {visit}: an unequivocal new lesion is recorded ({new_lesion_description}) but the overall response is reported as {reported_overall}."
      reason: "Under RECIST 1.1 the appearance of any unequivocal new lesion is progression, irrespective of the target and non-target responses. {irecist_note}"
      query: "A new lesion is recorded at {visit} while the overall response is {reported_overall}. Please confirm the new lesion and review the overall response assessment."
      tips: "Where the finding is equivocal rather than unequivocal, the correct handling is to record it as equivocal and continue treatment, treating the timepoint as not evaluable and re-assessing at the next visit; if later confirmed, progression is dated to this visit."
  - id: TE-RS-011
    family: RS
    title: "New lesion in an anatomical region not imaged at baseline"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: HYBRID
    status: RETIRED
    confidence_base_rate: 0.62
    required_fields: "imaging_metadata.regions_imaged (or inferred from baseline lesion organs and modality)"
    intent: "Ensure the region-not-imaged case was considered explicitly."
    logic: |
      if new lesion organ/region was not covered by the baseline imaging: raise finding
    messages:
      review_point: "Interpretation of a lesion found in a region that was not imaged at baseline."
      issue: "Subject {subject_id}, {visit}: a new lesion is recorded in {organ}, a region that does not appear to have been imaged at baseline ({baseline_regions})."
      reason: "A lesion identified in a region that was not scanned at baseline is considered a new lesion, and therefore progression, because pre-existing disease at that site cannot be excluded. The point of this check is to confirm that the site made this determination deliberately rather than by default, since the alternative interpretation — that the lesion was present but unimaged — is not permitted."
      query: "A new lesion is recorded in {organ} at {visit}. Baseline imaging does not appear to have covered this region. Please confirm the finding represents a new lesion and that baseline imaging of this region was not performed."
      tips: "Brain metastases are the usual case: many protocols do not require baseline brain imaging, so a first brain scan performed for symptoms yields lesions that must be treated as new. Confirm the protocol's imaging requirements before raising."
  - id: TE-RS-012
    family: RS
    title: "New lesion based on FDG-PET without confirmatory anatomical imaging"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.68
    required_fields: "lesions.method"
    intent: "Apply the PET rules for new lesion determination."
    logic: |
      if new lesion method == PET and no corresponding CT/MRI finding at the same site
         and no negative baseline PET recorded: raise finding
    messages:
      review_point: "Use of FDG-PET to establish a new lesion."
      issue: "Subject {subject_id}, {visit}: a new lesion in {organ} is based on FDG-PET, without a corresponding finding on anatomical imaging and without a negative baseline PET."
      reason: "A positive FDG-PET finding establishes a new lesion when the baseline PET was negative, or when the new site is confirmed on CT or MRI. Without either, a positive PET alone is not sufficient, because the finding may represent disease present but not FDG-avid or not imaged at baseline, or may be non-malignant uptake."
      query: "The new lesion recorded at {visit} in {organ} is based on FDG-PET. Please confirm whether a baseline PET was performed and negative, or whether the lesion is confirmed on CT or MRI."
      tips: "Inflammatory and infectious uptake is common, particularly under immunotherapy; anatomical confirmation matters most in that setting."
  - id: TE-RS-013
    family: RS
    title: "Equivocal new lesion later confirmed but progression not back-dated"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.82
    intent: "Progression is dated to the first observation of a lesion later confirmed."
    logic: |
      if a lesion was EQUIVOCAL at visit i and confirmed unequivocal at visit j > i:
      
          # guard — progression established at visit j on its own terms
          if at visit j the target criteria for PD are met from nadir
             or non-target response at visit j is PD independently of this lesion:
                 no finding: visit j is the correct progression date
      
          elif the recorded progression date != date of visit i:
                 raise finding
    messages:
      review_point: "Dating of progression when an equivocal finding is subsequently confirmed."
      issue: "Subject {subject_id}: lesion {lesion_id} was recorded as equivocal at {first_visit} ({first_date}) and confirmed at {confirm_visit} ({confirm_date}); the progression date is recorded as {recorded_pd_date}."
      reason: "Where therapy continues after an equivocal finding and the finding is subsequently confirmed as a new lesion, progression is dated to the time of the initial observation, not to the confirming assessment. Using the later date overstates progression-free survival by {days_difference} days."
      query: "Lesion {lesion_id} was recorded as equivocal at {first_visit} and as confirmed at {confirm_visit}. The progression date recorded for this subject is {reported_pd_date}. Please confirm the progression date against the source imaging reports for both visits."
      tips: "Under iRECIST the handling differs — the iUPD and iCPD dates are both retained and the analysis convention is protocol-specific. Check which criteria govern before applying this rule."
  - id: TE-RS-014
    family: RS
    title: "Complete or partial response counted as best overall response without confirmation"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.90
    required_fields: "protocol_config.response_confirmation_required = true"
    intent: "Enforce the protocol's confirmation requirement."
    logic: |
      if config.response_confirmation_required
         and reported_best_overall_response in (CR, PR)
         and no subsequent assessment >= config.confirmation_min_interval_days later
            with a response of at least the same rank: raise finding
    messages:
      review_point: "Confirmation of complete and partial responses where the protocol requires it."
      issue: "Subject {subject_id}: best overall response is recorded as {reported_bor} based on {first_visit} ({first_date}), but the next assessment {next_description} does not confirm it."
      reason: "The protocol requires confirmation of a complete or partial response by a repeat assessment performed no less than {confirm_days} days after the criteria were first met. Without confirmation the response is unconfirmed and the derived best overall response is {derived_bor}. Counting unconfirmed responses inflates the objective response rate."
      query: "The best overall response is recorded as {reported_bor} based on the assessment at {first_visit}. A confirmatory assessment at least {confirm_days} days later does not appear to support this response. Please review the best overall response."
      tips: "Check whether a confirmatory scan exists but was entered as an unscheduled visit; also check the interval, since a confirmation performed too early does not satisfy the requirement."
  - id: TE-RS-015
    family: RS
    title: "Reported best overall response does not match the derived best overall response"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.93
    intent: "Recompute best overall response across the whole subject timeline."
    logic: |
      derived = bestOverallResponse(orderedTimepoints, config)
      if reported_bor != derived.bor: raise finding
    messages:
      review_point: "Derivation of best overall response across all timepoints, applying the confirmation requirement and excluding assessments after progression."
      issue: "Subject {subject_id}: best overall response is reported as {reported_bor}; derived as {derived_bor}. Timepoint responses considered: {timepoint_sequence}."
      reason: "{bor_explanation}"
      query: "The best overall response recorded for this subject is {reported_bor}. Based on the recorded timepoint responses ({timepoint_sequence}) and the protocol's confirmation requirement, the best overall response derives as {derived_bor}. Please review."
      tips: "Two frequent causes: a response recorded after progression being counted, and a stable disease result assigned before the protocol's minimum duration from baseline has elapsed."
  - id: TE-RS-016
    family: RS
    title: "Partial response or stable disease assigned to a subject without measurable disease at baseline"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.92
    intent: "Non-target-only subjects have a restricted response vocabulary."
    logic: |
      if subject has no target lesions at baseline
         and reported_overall in (PR, SD): raise finding
    messages:
      review_point: "Permitted response categories for subjects with non-measurable disease only."
      issue: "Subject {subject_id}, {visit}: overall response is reported as {reported_overall}, but no target lesions were selected at baseline."
      reason: "A subject with non-measurable disease only can be assigned a complete response, Non-CR/Non-PD, progressive disease or not evaluable. Partial response and stable disease require measurable disease, since both are defined by a change in the sum of diameters. The corresponding category here is Non-CR/Non-PD."
      query: "The overall response at {visit} is recorded as {reported_overall}, and no target lesions are recorded at baseline for this subject. Please confirm the baseline lesion records and the overall response at this visit."
      tips: "Check first whether target lesions were in fact selected but failed to load — a missing target lesion record produces this finding spuriously. Look for a companion structural finding on this subject."
  - id: TE-RS-017
    family: RS
    title: "Stable disease assigned before the protocol's minimum duration"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.80
    required_fields: "protocol_config.sd_min_duration_days"
    intent: "Stable disease requires a minimum interval from baseline."
    logic: |
      if reported_overall == SD
         and (assessment_date - baseline_date) < config.sd_min_duration_days: raise finding
    messages:
      review_point: "Minimum duration from baseline required before stable disease can be assigned."
      issue: "Subject {subject_id}, {visit}: stable disease is reported {days} days after baseline; the protocol requires a minimum of {min_days} days."
      reason: "Stable disease is meaningful only if maintained for a minimum interval defined by the protocol. An earlier assessment cannot establish stability, and counting it inflates the disease control rate."
      query: "Stable disease is recorded at {visit}, {days} days after baseline, which is shorter than the minimum of {min_days} days specified in the protocol. Please review the response assessment."
      tips: "This affects best overall response rather than the timepoint response in many conventions; confirm the sponsor's derivation convention before querying the site."
  - id: TE-RS-018
    family: RS
    title: "Response recorded after a documented progression"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.85
    intent: "Post-progression assessments must not contribute to response endpoints."
    logic: |
      if an assessment after the first PD carries a response in (CR, PR, SD)
         and it contributes to the reported best overall response: raise finding
    messages:
      review_point: "Treatment of assessments performed after progression in response derivation."
      issue: "Subject {subject_id}: progression is recorded at {pd_visit} ({pd_date}), and a response of {response} is recorded at {later_visit} ({later_date})."
      reason: "Best overall response is determined from the assessments recorded from the start of treatment until progression. Assessments after progression are retained in the data but do not contribute to the response endpoints. Including one here changes the best overall response from {derived_bor} to {reported_bor}."
      query: "A response of {response} is recorded at {later_visit}, after progression was recorded at {pd_visit}. Please confirm the progression date and the response assessments."
      tips: "Where the subject continued treatment beyond progression, the later assessments are legitimate data; the issue is their use in derivation, not their existence. If iRECIST applies, progression may have been unconfirmed and the later assessments are then fully valid — check the applicable criteria."
  - id: TE-RS-019
    family: RS
    title: "Recorded progression date does not match the earliest assessment meeting progression criteria"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.88
    intent: "Progression dating."
    logic: |
      derived_date = progressionDate(orderedTimepoints, config)
      if |reported_progression_date - derived_date| > 0 days: raise finding
    messages:
      review_point: "Dating of disease progression relative to the assessments that meet progression criteria."
      issue: "Subject {subject_id}: progression date recorded as {reported_date}; the earliest assessment meeting progression criteria is {derived_visit} on {derived_date} ({days_difference} days difference)."
      reason: "Progression-free survival is measured to the date of the first assessment demonstrating progression. A difference of {days_difference} days changes the event time for this subject and, aggregated across subjects, biases the survival estimate."
      query: "The progression date is recorded as {reported_date}, while the earliest assessment meeting progression criteria is {derived_visit} on {derived_date}. Please confirm the date of progression."
      tips: "Distinguish radiological progression from clinical progression: if progression was determined clinically, the date may legitimately precede any imaging, and the record should say so."
  - id: TE-RS-020
    family: RS
    title: "Investigator and independent central review assessments discordant"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.50
    required_fields: "protocol_config.bicr_collected = true"
    intent: "Surface discordance where both streams exist."
    logic: |
      for each subject with both INVESTIGATOR and BICR streams:
          discordant = assessments where responses differ,
                       or progression dates differ by > config.bicr_date_tolerance_days
          if discordant is non-empty:
              raise ONE finding per subject listing the discordant assessments
              severity MAJOR when any difference changes best overall response or the
                             progression date; INFO otherwise
      
      guards:
        - disabled by default; enabled per study in configuration (FR-12)
        - audience STUDY_TEAM — never issued as a site query
    messages:
      review_point: "Concordance between the investigator assessment and the independent central review."
      issue: "Subject {subject_id}, {visit}: investigator response {inv_response}, central review response {bicr_response}. {date_note}"
      reason: "Discordance between the investigator and central review is expected at some rate, but discordance that crosses a progression boundary affects the primary endpoint where the central review is the basis of analysis, and may indicate a systematic difference in lesion selection or measurement at this site."
      query: "Not applicable: this finding is for internal review and reconciliation and is not normally issued as a site query."
      tips: "Review the lesion-level data from both readers side by side. Consistent directional discordance at one site is a monitoring signal; scattered discordance is normal reader variability. Where the sponsor keeps the two streams deliberately separated, this rule should be disabled in configuration."
  - id: TE-RS-021
    family: RS
    title: "New or worsening effusion used as evidence of progression without cytological confirmation"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: HYBRID
    status: PROPOSED_OPTIONAL
    confidence_base_rate: 0.55
    required_fields: "reported_responses.overall, non_target_state, lesion description text, derived target response, cytology result where collected"
    intent: "Progression driven by an effusion must rest on cytological confirmation where the measurable disease is responding or stable."
    logic: |
      for each assessment a where reported overall response == PD:
          effusions = non-target or new-lesion records at a whose organ or description
                      matches an effusion pattern (pleural, pericardial, peritoneal / ascites)
          for e in effusions:
              appeared  = e not present at the previous assessment
              worsened  = e.non_target_state moved toward worsening since the previous assessment
              if (appeared or worsened)
                 and derived target_response at a in (CR, PR, SD)
                 and no cytology or histology result recorded for e:
                     raise finding
      
      guards:
        - suppress when unequivocal progression is evidenced independently of the effusion
        - suppress when derived target response is itself PD
        - deactivate when the protocol waives cytological confirmation (set at AC-11 intake)
        - deactivate when no cytology field is collected, reporting NOT_EVALUATED
    messages:
      review_point: "Whether a new or worsening effusion used to support progression carries the cytological confirmation RECIST requires."
      issue: "Progressive disease is recorded at {visit} for subject {subject_id}. The supporting non-target finding is {effusion_description}, which {appeared_or_worsened} at this visit, while target lesions show {target_response_derived}. No cytological result is recorded for the effusion."
      reason: "RECIST 1.1 requires that an effusion appearing or worsening during treatment be confirmed cytologically before it is taken as evidence of progression, where the measurable disease is responding or stable. Effusions arise from causes unrelated to tumor progression, including the treatment itself and intercurrent illness. An unconfirmed effusion is a recognised source of spurious progression, which censors the subject early and shortens progression-free survival."
      query: "Progressive disease is recorded at {visit}, supported by {effusion_description}, while target lesions show {target_response_derived}. Please confirm whether cytological assessment of the effusion was performed and record the result. If cytology was not performed, please confirm the basis on which progression was assessed."
      tips: "This matters most where the effusion is the sole basis for progression; where other unequivocal progression exists the finding is suppressed. Some protocols explicitly waive cytological confirmation — check the protocol before querying, and if it is waived, deactivate this rule at the AC-11 intake rather than dispositioning each occurrence."
  - id: TE-ST-001
    family: ST
    title: "Lesion measured at follow-up but not identified at baseline or as a new lesion"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.88
    required_fields: "lesions.lesion_id, measurements.lesion_id"
    intent: "Every measurement must belong to a lesion with a known identity and category."
    logic: |
      for m in measurements: if m.lesion_id not in lesions: raise finding
    messages:
      review_point: "Referential integrity between tumor measurement records and tumor identification records."
      issue: "Subject {subject_id}, {visit}: a measurement of {value} mm is recorded for lesion {lesion_id}, but no corresponding lesion identification record exists."
      reason: "Measurements can only be interpreted against an identified lesion with a category (target/non-target/new) and location. Without it, the lesion cannot enter the sum of diameters, and the derived response may be wrong."
      query: "A measurement is recorded for lesion {lesion_id} at {visit} but this lesion is not present on the tumor identification form. Please confirm the lesion identification and complete the missing record, or correct the lesion number on the measurement."
      tips: "Most often a lesion numbering typo, or a new lesion measured before it was formally recorded as new. Check whether the number matches an existing lesion at another site of disease."
  - id: TE-ST-002
    family: ST
    title: "Duplicate lesion identity"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.80
    intent: "The same anatomical lesion must not be recorded twice."
    logic: |
      group lesions by (subject, organ, laterality, normalised location_detail)
      if group size > 1 and all members share the same category:
          if baseline values differ by <= config.duplicate_size_tolerance_mm (default 2)
             or any member has no baseline value:
                 raise finding
      
      guards:
        - no finding where the descriptions carry distinguishing detail
          (segment, lobe, station, numbering) — two separate lesions, not a duplicate
        - no finding where baseline values differ materially: distinct lesions
    messages:
      review_point: "Duplicate recording of the same lesion under two lesion numbers."
      issue: "Subject {subject_id}: lesions {lesion_id_a} and {lesion_id_b} are both recorded as {category} at {organ} {laterality} ({location_a} / {location_b})."
      reason: "If the same lesion is recorded twice, it is counted twice in the sum of diameters, inflating tumor burden and distorting percent change and the nadir."
      query: "Lesions {lesion_id_a} and {lesion_id_b} appear to describe the same lesion at {organ}. Please confirm whether these are two distinct lesions; if not, please remove the duplicate and update the affected assessments."
      tips: "Compare the baseline sizes and the size trajectory: identical or near-identical values across visits strongly suggests duplication."
  - id: TE-ST-003
    family: ST
    title: "Nodal lesion recorded without a short axis"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.80
    required_fields: "CRF specification field semantics (nodal axis source), measurement.axis_recorded where collected"
    intent: "Nodal lesions must be measured in short axis; a longest diameter cannot substitute."
    logic: |
      axis_source = resolve_nodal_axis_source(crf_specification)   # set once at AC-11 intake
         1. explicit axis-type field on the measurement form, if collected
         2. axis implied by the CRF field itself (e.g. a field named 'Short axis (mm)')
         3. protocol default declared at intake
      
      if lesion.is_nodal and axis_source cannot establish the measurement as a short axis:
          raise finding
      
      guards:
        - no finding where the CRF collects a single nodal field whose semantics are unambiguous
        - where axis_source is unresolved for the study, deactivate and report NOT_EVALUATED
    messages:
      review_point: "Measurement axis for lymph node lesions."
      issue: "Subject {subject_id}, {visit}, lesion {lesion_id} ({organ} node): the recorded measurement appears to be a longest diameter rather than a short axis."
      reason: "RECIST 1.1 requires the short axis for nodal lesions, at baseline and at every follow-up. Using the longest diameter overstates the nodal contribution to the sum and can mask a response or create a false progression."
      query: "Lesion {lesion_id} is recorded as a lymph node. Please confirm, against the source imaging report, which axis the measurement recorded at {visit} represents and whether the value is correct."
      tips: "Nodal lesions were only formally distinguished from RECIST 1.0 onwards in version 1.1; sites experienced with older studies frequently record the long axis out of habit."
  - id: TE-ST-004
    family: ST
    title: "Unit or precision inconsistency"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.85
    intent: "Detect mixed cm/mm entry and implausible precision."
    logic: |
      if original_unit differs within a subject, or a value is < 1 with unit mm,
      or a non-nodal target value > 300 mm: raise finding
    messages:
      review_point: "Consistency of measurement units and precision across a subject's records."
      issue: "Subject {subject_id}: measurements are recorded in {units_seen}; lesion {lesion_id} at {visit} has value {original_value} {original_unit}."
      reason: "A centimetre value entered in a millimetre field understates a lesion tenfold, which can convert a progression into an apparent response."
      query: "Please confirm the unit of the measurement for lesion {lesion_id} at {visit} ({original_value} {original_unit}); the value appears inconsistent with the other measurements recorded for this subject."
      tips: "Check the trajectory of the same lesion across visits — a tenfold step between adjacent visits is diagnostic of a unit error."
  - id: TE-ST-005
    family: ST
    title: "Assessment visit sequence and date order inconsistent"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.90
    intent: "Visit numbering and assessment dates must be monotonic."
    logic: |
      order assessments by visit_number; if assessment_date is not non-decreasing: raise finding
    messages:
      review_point: "Chronological consistency of tumor assessment visits."
      issue: "Subject {subject_id}: {visit_a} ({date_a}) is dated after {visit_b} ({date_b}) although it precedes it in the visit sequence."
      reason: "Nadir, progression dating and best overall response all depend on chronological order. An out-of-order date can move the nadir and change the progression determination."
      query: "The assessment dates for {visit_a} and {visit_b} appear inconsistent with the visit sequence. Please verify the assessment dates."
      tips: "Confirm against the scan dates in the imaging report rather than the visit date, which may reflect the clinic visit rather than the scan."
  - id: TE-XD-001
    family: XD
    title: "End of treatment due to progression but no progression recorded in the tumor data"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.78
    required_fields: "cross_domain.disposition"
    intent: ""
    logic: |
      if disposition reason indicates progressive disease
         and no assessment with overall response PD (or iCPD) exists: raise finding
    messages:
      review_point: "Consistency between the reason for treatment discontinuation and the recorded tumor response."
      issue: "Subject {subject_id}: treatment discontinued on {disposition_date} for {disposition_reason}, but no assessment records progressive disease. Last recorded response: {last_response} at {last_visit}."
      reason: "If treatment stopped for progression, either an assessment demonstrating progression is missing from the tumor data, or the discontinuation reason is incorrect. Both affect the progression-free survival analysis: a missing progression event leads to censoring instead of an event."
      query: "Treatment was discontinued for {disposition_reason} on {disposition_date}, but no tumor assessment recording progression is present. Please confirm whether a tumor assessment demonstrating progression was performed, and enter the data if so; if progression was determined clinically, please confirm the basis and the date."
      tips: "Clinical progression without radiological confirmation is legitimate and common near end of life; the record should show it as such rather than leaving the tumor data silent."
  - id: TE-XD-002
    family: XD
    title: "Progression recorded in the tumor data but treatment continued without documented rationale"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.62
    required_fields: "cross_domain.exposure"
    intent: ""
    logic: |
      if PD recorded (RECIST 1.1 study, not iRECIST)
         and dosing continued > config.post_pd_treatment_days (default 42) after the PD date
         and no treatment-beyond-progression documentation exists: raise finding
    messages:
      review_point: "Continuation of study treatment after documented progression."
      issue: "Subject {subject_id}: progression recorded at {pd_visit} ({pd_date}); study treatment continued until {last_dose_date}, {days} days beyond progression."
      reason: "Treatment beyond progression may be permitted by the protocol, but it must be documented, and it changes the interpretation of subsequent assessments. Where it is not permitted, this is a protocol deviation. Where the study uses iRECIST, the earlier assessment may have been unconfirmed progression rather than confirmed progression, in which case continuation is expected and the response coding needs review instead."
      query: "Study treatment continued for {days} days after the progression recorded at {pd_visit}. Please confirm the progression assessment and whether continuation beyond progression was approved."
      tips: "Check the applicable response criteria first — under iRECIST this pattern is normal and the finding should be rejected."
  - id: TE-XD-003
    family: XD
    title: "New anticancer therapy started before recorded progression"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.75
    required_fields: "cross_domain.anticancer_therapy"
    intent: ""
    logic: |
      if a new systemic anticancer therapy starts before the recorded progression date
         (or before any recorded progression):
             raise finding
      
      guards:
        - suppress therapies listed in config.permitted_concomitant_therapies
          (bone-modifying agents, hormonal maintenance, protocol-permitted supportive care)
        - suppress where the therapy is local rather than systemic — that is TE-XD-004
        - suppress where the start date is within config.therapy_date_tolerance_days
          (default 7) of a recorded progression: date-entry noise, not a real sequence error
    messages:
      review_point: "Timing of new anticancer therapy relative to the recorded progression."
      issue: "Subject {subject_id}: new anticancer therapy ({therapy}) started on {therapy_date}; recorded progression date {pd_date_or_none}."
      reason: "Starting a new anticancer therapy before recorded progression usually indicates that progression occurred but was not captured, or that treatment changed for another documented reason. In progression-free survival analyses the start of new therapy is commonly a censoring or event-defining event, so the discrepancy has direct analytical consequences, and any tumor assessment after the new therapy no longer reflects the study treatment."
      query: "A new anticancer therapy ({therapy}) started on {therapy_date}, before any recorded disease progression. Please confirm the reason for starting new therapy and whether a tumor assessment demonstrating progression was performed."
      tips: "Radiotherapy for symptom palliation is a frequent benign explanation; distinguish it from a change of systemic therapy."
  - id: TE-XD-004
    family: XD
    title: "Local therapy applied to a target lesion during the study"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.80
    required_fields: "cross_domain.radiotherapy or procedures"
    intent: ""
    logic: |
      if radiotherapy, surgery or ablation is recorded at a site matching a target lesion
         after baseline:
             raise ONE finding for that lesion, listing every subsequent assessment
             in which the lesion still contributes to the sum
      
      guards:
        - suppress where the lesion was already excluded from the sum after the therapy
        - suppress where the therapy date precedes baseline (covered by TE-BL-008)
    messages:
      review_point: "Effect of locoregional therapy on the interpretation of a target lesion."
      issue: "Subject {subject_id}: {procedure} was applied to {site} on {procedure_date}, matching target lesion {lesion_id}; measurements of this lesion continue at {later_visits}."
      reason: "Once a lesion has received locoregional therapy, its subsequent size no longer reflects the systemic treatment effect, and RECIST treats such lesions as non-measurable unless progression is demonstrated. Continuing to include it in the sum understates tumor burden and can produce a spurious partial response."
      query: "{procedure} was applied to {site} on {procedure_date}, which corresponds to target lesion {lesion_id}. Please confirm and clarify how this lesion has been assessed at subsequent visits."
      tips: "The usual analytical convention is that the subject is considered to have progressed, or is censored, at the time of local therapy to a target lesion; confirm the protocol's convention with the statistician."
  - id: TE-XD-005
    family: XD
    title: "Adverse event indicating disease progression without a corresponding tumor assessment"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.70
    required_fields: "cross_domain.adverse_events"
    intent: ""
    logic: |
      if an AE term maps to disease progression / malignant neoplasm progression
         and no PD assessment exists within config.ae_pd_window_days (default 60):
             raise finding
      
      guards:
        - suppress where the subject died, or discontinued for clinical deterioration,
          before the next scheduled assessment was due
        - suppress where an assessment exists in the window but is NOT EVALUABLE with
          a recorded reason
        - audience STUDY_TEAM where suppressed: the endpoint still needs a decision
    messages:
      review_point: "Consistency between adverse events indicating disease progression and the tumor assessment data."
      issue: "Subject {subject_id}: adverse event \"{ae_term}\" with onset {ae_date}; no tumor assessment recording progression within {window} days."
      reason: "An adverse event of disease progression implies a clinical determination of progression. If the tumor data does not reflect it, the progression event may be missing from the efficacy analysis, or the adverse event may have been coded inappropriately — disease progression is frequently reported as an adverse event when it should be captured as an efficacy outcome."
      query: "An adverse event of \"{ae_term}\" is recorded with onset {ae_date}. Please confirm whether disease progression was documented and whether a tumor assessment was performed at that time."
      tips: "Many sponsors instruct sites not to report disease progression as an adverse event; where that convention applies, the finding is also a coding issue for the safety team."
  - id: TE-XD-006
    family: XD
    title: "Death recorded before the last tumor assessment or before the progression date"
    guideline: "RECIST 1.1 + iRECIST"
    severity: CRITICAL
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.90
    required_fields: "subjects.death_date"
    intent: ""
    logic: |
      if death_date < last assessment_date or death_date < recorded progression date: raise finding
    messages:
      review_point: "Consistency of the death date with the tumor assessment and progression dates."
      issue: "Subject {subject_id}: death recorded on {death_date}; {conflicting_record} dated {conflict_date}."
      reason: "A tumor assessment or progression date after the date of death is impossible, so one of the dates is wrong. Both feed survival and progression-free survival analyses directly."
      query: "The date of death ({death_date}) precedes {conflicting_record} ({conflict_date}). Please verify both dates."
      tips: "Partial dates are a frequent cause; check whether an imputed date is being compared against a complete one."
  - id: TE-XD-007
    family: XD
    title: "Tumor marker not normalised while a complete response is reported"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.60
    required_fields: "protocol_config.tumor_markers_used_for_cr = true, cross_domain.lab_markers"
    intent: ""
    logic: |
      if reported overall response == CR and marker value > upper limit of normal: raise finding
    messages:
      review_point: "Normalisation of tumor markers as a condition of complete response, where the protocol requires it."
      issue: "Subject {subject_id}, {visit}: complete response reported while {marker} is {value} {unit} (upper limit of normal {uln})."
      reason: "Where the protocol includes tumor markers in the response definition, a complete response requires marker normalisation in addition to the disappearance of all lesions. A persistently elevated marker means the response is Non-CR/Non-PD."
      query: "A complete response is recorded at {visit} while {marker} remains above the upper limit of normal ({value} {unit}). Please review the response assessment."
      tips: "Marker elevation can have non-malignant causes; the site's explanation may be sufficient without a data change."
  - id: TE-XD-008
    family: XD
    title: "Imaging modality not among those permitted by the protocol"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.58
    required_fields: "protocol_config.allowed_modalities"
    intent: ""
    logic: |
      if measurement method not in config.allowed_modalities: raise finding
    messages:
      review_point: "Use of imaging modalities permitted by the protocol and imaging charter."
      issue: "Subject {subject_id}, {visit}: lesion {lesion_id} assessed by {method}; the protocol permits {allowed_modalities}."
      reason: "Modalities differ in sensitivity and in measurement reproducibility. Using a modality outside the protocol makes the measurement non-comparable with the rest of the subject's data and with other subjects."
      query: "Lesion {lesion_id} was assessed by {method} at {visit}, which is not among the modalities specified in the protocol. Please confirm the modality used."
      tips: "Contrast versus non-contrast CT is the most consequential variant and is often not captured as a distinct modality; consider whether the eCRF should distinguish them."
  - id: TE-XD-009
    family: XD
    title: "Required disease-site imaging missing"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: CONDITIONAL
    confidence_base_rate: 0.62
    required_fields: "protocol_config imaging requirements"
    intent: ""
    logic: |
      if the protocol requires imaging of a region (e.g. brain in a study enrolling subjects
         with brain metastases) and no assessment covers that region: raise finding
    messages:
      review_point: "Coverage of all protocol-required anatomical regions at each assessment."
      issue: "Subject {subject_id}, {visit}: no assessment of {required_region} although the protocol requires it{subject_context}."
      reason: "Disease in an unimaged region cannot be assessed, and a lesion later found there must be treated as a new lesion. Missing required imaging therefore both reduces the reliability of the current response and risks a spurious progression later."
      query: "No assessment of {required_region} is recorded at {visit} although the protocol requires it. Please confirm whether the imaging was performed and enter the results."
      tips: "Brain imaging is the usual case, particularly in lung cancer and melanoma studies."
  - id: TE-XD-010
    family: XD
    title: "Best overall response inconsistent with the subject's timepoint responses at study level"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MAJOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.88
    intent: ""
    logic: |
      if reported_bor rank is better than the best reported timepoint response: raise finding
    messages:
      review_point: "Consistency of the recorded best overall response with the recorded timepoint responses."
      issue: "Subject {subject_id}: best overall response recorded as {reported_bor}, while the best timepoint response recorded is {best_timepoint} at {visit}."
      reason: "The best overall response cannot be better than any response actually recorded at a timepoint. This indicates either a missing timepoint assessment or an incorrect best overall response."
      query: "The best overall response is recorded as {reported_bor}, but the best response recorded at any timepoint is {best_timepoint}. Please review."
      tips: "Check for an unscheduled assessment that was not entered; a response confirmed at an unscheduled visit is a common cause."
  - id: TE-XD-011
    family: XD
    title: "Subject has no post-baseline assessment"
    guideline: "RECIST 1.1 + iRECIST"
    severity: INFO
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.55
    intent: ""
    logic: |
      if subject has a baseline assessment, received treatment,
         and has no post-baseline tumor assessment: raise finding
    messages:
      review_point: "Availability of at least one post-baseline tumor assessment for each treated subject."
      issue: "Subject {subject_id}: treated from {first_dose_date} with no post-baseline tumor assessment; last known status {status}."
      reason: "A treated subject with no post-baseline assessment is not evaluable for response and is censored at randomisation or treatment start in progression-free survival, which reduces the power of the analysis. The reason should be documented."
      query: "No post-baseline tumor assessment is recorded for this subject. Please confirm whether an assessment was performed, and record the reason if it was not."
      tips: "Early death or early withdrawal are the usual explanations and are legitimate; the finding exists to ensure the reason is captured."
  - id: TE-XD-012
    family: XD
    title: "Site-level pattern of the same finding"
    guideline: "RECIST 1.1 + iRECIST"
    severity: MINOR
    mode: DETERMINISTIC
    status: ACTIVE
    confidence_base_rate: 0.70
    intent: ""
    logic: |
      if a rule fires for >= config.site_pattern_min_subjects (default 3) subjects at one site
         and the site's rate exceeds the study rate by config.site_pattern_factor (default 3):
         raise one aggregate finding and link the individual findings
    messages:
      review_point: "Detection of systematic issues at a site rather than isolated data errors."
      issue: "Site {site_id}: rule {source_rule_id} ({source_rule_title}) fires for {n_subjects} of {site_subjects} subjects, against a study rate of {study_rate}%."
      reason: "A concentration of the same issue at one site usually reflects a training or process gap rather than isolated errors. Addressing it at the site level resolves the whole cluster and prevents recurrence, whereas issuing individual queries treats the symptom."
      query: "Not applicable: this finding is directed to the monitoring team rather than to the site as a data query."
      tips: "Pair with a site training action and re-check at the next data cut; the recurrence status on the linked findings will show whether the intervention worked."
